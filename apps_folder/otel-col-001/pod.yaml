#OTEL Collector Contrib Pod
apiVersion: v1
kind: Pod
metadata:
  name: otel-col-contrib
  namespace: otel-col-001
spec:
  containers:
    - name: otel-col-contrib
      image: otel/opentelemetry-collector-contrib
      ports:
        - containerPort: 4317
      env:
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.name=otel-col-contrib

  deploy:
    replicas: 1
  
  #set cpu limits
  resources:
   limits:
     cpu: "200m"
     memory: "256Mi"
   requests:
     cpu: "100m"
     memory: "128Mi"

