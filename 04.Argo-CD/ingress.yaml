# K3s Traefik Ingress for svc argocd-server port 443
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: argocd-server-passthrough
  namespace: argocd
spec:
  entryPoints:
    - websecure # Puerto 443 en Traefik
  routes:
    - match: HostSNI(`argocd.k3s.local`)
      services:
        - name: argocd-server
          port: 443
  tls:
    passthrough: true
